name: Build APK

on:
  push:
    branches: [ main, docx-improvements ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK
        run: ./gradlew assembleFossDebug --stacktrace

      - name: Prepare APK file
        run: |
          mkdir -p release-asset
          cp app/build/outputs/apk/foss/debug/*.apk release-asset/Fossify-Documents.apk

      - name: Publish Direct APK Download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Fossify Documents (with DOCX improvements)
          draft: false
          prerelease: false
          files: release-asset/Fossify-Documents.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
